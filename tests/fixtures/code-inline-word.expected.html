<p style="font-family: Arial, sans-serif; font-size: 12px;">Send the document using <code style="font-family:'Courier New',Consolas,monospace;font-size:12px;white-space:normal;overflow-wrap:anywhere">UPDATE_DOCUMENT</code>, or <code style="font-family:'Courier New',Consolas,monospace;font-size:12px;white-space:normal;overflow-wrap:anywhere">FORCE_UPDATE</code> for a forced update. Monitor the queue.</p>

<p style="font-family: Arial, sans-serif; font-size: 12px;">Use <strong><code style="font-family:'Courier New',Consolas,monospace;font-size:12px;white-space:normal;overflow-wrap:anywhere">ITEM_COUNT</code></strong> with <a href="https://example.com/help"><code style="font-family:'Courier New',Consolas,monospace;font-size:12px;white-space:normal;overflow-wrap:anywhere">record_id</code></a>.</p>

<p style="font-family: Arial, sans-serif; font-size: 12px;">Replace <code style="font-family:'Courier New',Consolas,monospace;font-size:12px;white-space:normal;overflow-wrap:anywhere">{customer_id}</code> with your ID. The <code style="font-family:'Courier New',Consolas,monospace;font-size:12px;white-space:normal;overflow-wrap:anywhere">&lt;field&gt;</code> tag holds a value. Keep amounts &lt; 100.</p>

<p style="font-family: Arial, sans-serif; font-size: 12px;"><code style="font-family:'Courier New',Consolas,monospace;font-size:12px;white-space:normal;overflow-wrap:anywhere">SINGLE_IDENTIFIER</code></p>

<p style="font-family: Arial, sans-serif; font-size: 12px;">Normal text around <code style="font-family:'Courier New',Consolas,monospace;font-size:12px;white-space:normal;overflow-wrap:anywhere">one_token</code> stays a sentence.</p>
